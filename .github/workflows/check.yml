name: Check
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: mkdir -p .artifacts/runtime .artifacts/project
      - run: echo "TMPDIR=$GITHUB_WORKSPACE/.artifacts/runtime" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm install --prefix .artifacts/codex-cli @openai/codex
      - run: npm run setup -- --project "$PWD/.artifacts/project" --codex "$PWD/.artifacts/codex-cli/node_modules/.bin/codex" --accept-server-license-terms
      - run: npm run build
      - run: npm test
      - run: npm run pack:source
  android:
    runs-on: ubuntu-latest
    env:
      TMPDIR: ${{ github.workspace }}/.artifacts/runtime
      JAVA_TOOL_OPTIONS: -Djava.io.tmpdir=${{ github.workspace }}/.artifacts/runtime
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p .artifacts/runtime
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '15859902'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Build Android and run lint
        run: ./gradlew --no-daemon --console=plain -PcodexServerUrl=https://codex.example.com assembleDebug lintDebug
        working-directory: android
